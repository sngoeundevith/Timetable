<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>កាលវិភាគមធ្យមសិក្សា</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;500;600;700&family=Moul&display=swap">
<style>
/* Layout: one wide column. Header with the single primary action, a tab rail for data entry, and a timetable workspace whose master grid scrolls inside its own frame. */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface2: #eef2f8; --ink: #16213a; --muted: #5a6580;
  --line: #d9e0ec; --line2: #e8edf5;
  --accent: #1c4fa0; --accent-ink: #ffffff; --accent-soft: #e3ecfb;
  --good: #17784a; --good-soft: #dff3e8; --warn: #8f5400; --warn-soft: #fdeccc; --bad: #b3261e; --bad-soft: #fbe0dd;
  --sj-bg-s: 62%; --sj-bg-l: 89%; --sj-fg-s: 55%; --sj-fg-l: 21%;
  --f-body: 'Battambang', system-ui, sans-serif;
  --f-display: 'Moul', 'Battambang', system-ui, sans-serif;
  --shadow: 0 1px 2px rgba(20, 33, 58, .06), 0 4px 14px rgba(20, 33, 58, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #151d31; --surface2: #1b2540; --ink: #e7ecf8; --muted: #97a3bf;
    --line: #2a3656; --line2: #222d4a;
    --accent: #7fa8ff; --accent-ink: #0b1630; --accent-soft: #1d2d55;
    --good: #6fd6a0; --good-soft: #15332a; --warn: #f0b45a; --warn-soft: #3a2d12; --bad: #ff8f86; --bad-soft: #3c1c1a;
    --sj-bg-s: 34%; --sj-bg-l: 25%; --sj-fg-s: 70%; --sj-fg-l: 88%;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #151d31; --surface2: #1b2540; --ink: #e7ecf8; --muted: #97a3bf;
  --line: #2a3656; --line2: #222d4a;
  --accent: #7fa8ff; --accent-ink: #0b1630; --accent-soft: #1d2d55;
  --good: #6fd6a0; --good-soft: #15332a; --warn: #f0b45a; --warn-soft: #3a2d12; --bad: #ff8f86; --bad-soft: #3c1c1a;
  --sj-bg-s: 34%; --sj-bg-l: 25%; --sj-fg-s: 70%; --sj-fg-l: 88%;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.7 var(--f-body); -webkit-text-size-adjust: 100%; }
.wrap {
  max-width: 1480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 56px;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.hdr { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-bottom: 14px; }
.brand { min-width: 0; }
.brand h1 { font: 400 28px/1.5 var(--f-display); letter-spacing: .02em; color: var(--accent); }
.brand p { color: var(--muted); font-size: 13px; }
.hdr-act { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* buttons & controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 4px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface2); }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; min-height: 42px; padding: 6px 20px; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn.sm { min-height: 30px; padding: 2px 10px; font-size: 13px; }
.btn.icon { min-width: 36px; padding: 4px 8px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 12px; min-height: 30px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tag { display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500; background: var(--surface2); color: var(--muted); }
.tag.ok { background: var(--good-soft); color: var(--good); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
input[type="text"], input[type="number"], input[type="time"], select, textarea {
  width: 100%; min-height: 36px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
}
textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
input[type="number"] { font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 500; }

/* tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 16px; scrollbar-width: thin; }
.tabs button { border: 0; background: transparent; padding: 8px 16px; min-height: 42px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button small { margin-left: 6px; font-weight: 500; color: var(--muted); }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel + .panel { margin-top: 16px; }
.panel h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.row.between { justify-content: space-between; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 16px; }
.hint { color: var(--muted); font-size: 13px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 14px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.empty-note { color: var(--muted); padding: 28px 12px; text-align: center; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.stat b { display: block; font-size: 21px; line-height: 1.5; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { font-size: 12.5px; color: var(--muted); }
.stat.bad b { color: var(--bad); }
.stat.good b { color: var(--good); }
details.issues { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 14px; margin-bottom: 14px; }
details.issues summary { cursor: pointer; font-weight: 600; }
details.issues ul { margin: 6px 0 2px; padding-left: 20px; }

/* tables */
.scroll { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { padding: 4px 8px; border-bottom: 1px solid var(--line2); text-align: left; vertical-align: middle; }
.tbl thead th { background: var(--surface2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.tbl td input, .tbl td select { min-height: 32px; }
.tbl td.num input { width: 64px; text-align: center; }
.tbl tfoot td { font-weight: 600; background: var(--surface2); font-variant-numeric: tabular-nums; }
.tbl td.num { text-align: center; }
.over { color: var(--bad); }

/* subject chips */
.sj { --h: 210; background: hsl(var(--h) var(--sj-bg-s) var(--sj-bg-l)); color: hsl(var(--h) var(--sj-fg-s) var(--sj-fg-l)); border-radius: 6px; }

/* master grid */
.master-scroll { max-height: min(72vh, 900px); }
.master { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.master th, .master td { padding: 0; border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); background: var(--surface); }
.master thead th { position: sticky; z-index: 3; text-align: center; font-size: 12.5px; font-weight: 600; background: var(--surface2); }
.master thead tr:first-child th { top: 0; height: 32px; }
.master thead tr.sessrow th { top: 32px; height: 22px; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); white-space: nowrap; overflow: hidden; }
.master thead tr.sessrow th.pm { background: var(--surface2); color: var(--muted); }
.master thead tr.timerow th { top: 54px; height: 34px; font-weight: 500; color: var(--muted); line-height: 1.15; }
.master thead tr.timerow th b { display: block; font-size: 12.5px; color: var(--fg); }
.master thead tr.timerow th small { display: block; font-size: 10px; }
.master .corner { left: 0; z-index: 5; width: 96px; min-width: 96px; text-align: left; padding-left: 10px; }
.master .rh { position: sticky; left: 0; z-index: 2; width: 96px; min-width: 96px; max-width: 96px; text-align: left; padding: 0 8px; font-weight: 600; font-size: 13px; background: var(--surface2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.master .ds { border-left: 2px solid var(--line); }
.master .dayh.ds { border-left-width: 3px; }
.master .dayh.d1 { background: var(--accent-soft); }
.master td.cell { width: 60px; min-width: 60px; height: 46px; padding: 2px; cursor: pointer; }
.master td.empty { cursor: default; background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line2) 6px 7px); }
.cell .sj { height: 100%; padding: 1px 4px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; line-height: 1.35; }
.cell .sj b { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .sj i { font-style: normal; font-size: 10.5px; opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.master td.hl .sj { outline: 2px solid var(--accent); outline-offset: -2px; box-shadow: 0 0 0 2px var(--surface); }
.master td.dim .sj { opacity: .22; }
.hlbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 10px; }
.hlbar[hidden] { display: none; }

/* week grids (teacher / class view) */
.week { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; table-layout: fixed; }
.week th, .week td { border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); padding: 4px; background: var(--surface); vertical-align: middle; }
.week thead th { background: var(--surface2); text-align: center; font-weight: 600; }
.week .time { width: 112px; background: var(--surface2); font-size: 12.5px; text-align: left; line-height: 1.4; padding-left: 10px; }
.week .time small { display: block; color: var(--muted); font-size: 11.5px; }
.week .shifthead td { background: var(--surface2); font-weight: 700; color: var(--accent); font-size: 12.5px; padding: 2px 10px; }
.lesson { padding: 4px 8px; min-height: 48px; display: flex; flex-direction: column; justify-content: center; line-height: 1.4; }
.lesson b { font-weight: 700; font-size: 13px; }
.lesson i { font-style: normal; font-size: 12px; opacity: .85; }
.week td.free { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line2) 6px 7px); }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 90px; margin-top: 6px; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; font-size: 12px; color: var(--muted); height: 100%; }
.bars span { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }

/* teachers tab */
.tsplit { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
.tlist { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.titem { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line2); background: transparent; padding: 6px 12px; cursor: pointer; }
.titem:hover { background: var(--surface2); }
.titem[aria-current="true"] { background: var(--accent-soft); }
.titem b { display: block; font-weight: 600; }
.titem small { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 1px 12px; min-height: 30px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip.sm { min-height: 26px; padding: 0 10px; font-size: 12.5px; }
.chip.grp { border-style: dashed; font-weight: 600; }
.chip[disabled] { opacity: .5; cursor: not-allowed; }
.subjbox { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface2); }
.clsrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px dashed var(--line2); }


/* teacher availability grid */
.avail { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 560px; table-layout: fixed; }
.avail th, .avail td { border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); padding: 2px; background: var(--surface); }
.avail thead th { background: var(--surface2); text-align: center; padding: 0; }
.avail .time { width: 120px; background: var(--surface2); padding: 0; text-align: left; }
.avail .shifthead td { background: var(--surface2); font-weight: 700; color: var(--accent); font-size: 12.5px; padding: 2px 10px; }
.avh { width: 100%; min-height: 34px; padding: 2px 10px; border: 0; background: transparent; cursor: pointer; font-weight: 600; text-align: inherit; line-height: 1.35; }
.avh:hover { background: var(--accent-soft); }
.avh small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.av { width: 100%; min-height: 36px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; background: transparent; font-size: 12.5px; font-weight: 600; }
.av:hover { border-color: var(--line); background: var(--surface2); }
.av1 { background: var(--warn-soft); color: var(--warn); }
.av2 { background: var(--bad-soft); color: var(--bad); }
.t-warn { color: var(--warn); } .t-bad { color: var(--bad); }

/* export panel */
.exports { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px 16px; }
.exrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 10px; background: var(--surface2); }
.exrow > div:first-child { min-width: 0; }
.exrow b { display: block; font-weight: 700; }
.exrow span { color: var(--muted); font-size: 12.5px; }

/* overlays */
.busy { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(10, 16, 32, .55); padding: 16px; }
.busy[hidden] { display: none; }
.busy .card { width: min(420px, 100%); background: var(--surface); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
.bar { height: 10px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin: 12px 0 8px; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.toast { pointer-events: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 8px 18px; border-radius: 10px; max-width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); }
.toast[hidden] { display: none; }
.toast.err { background: var(--bad); color: #fff; }
.copybox { position: fixed; inset: 0; z-index: 55; background: rgba(10, 16, 32, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.copybox .card { width: min(640px, 100%); background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.foot { margin-top: 24px; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 16px; }

/* teacher availability grid */
.av { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 520px; table-layout: fixed; }
.av th, .av td { border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); padding: 0; text-align: center; font-size: 12px; background: var(--surface); }
.av thead th { background: var(--surface2); font-weight: 600; padding: 0; }
.av thead th button, .av th.pt button { width: 100%; border: 0; background: transparent; cursor: pointer; font-weight: 600; min-height: 32px; padding: 2px 6px; text-align: inherit; }
.av thead th button:hover, .av th.pt button:hover { background: var(--accent-soft); }
.av th.pt { width: 120px; background: var(--surface2); text-align: left; line-height: 1.35; }
.av th.pt button { text-align: left; font-weight: 500; padding-left: 8px; }
.av th.pt small { display: block; color: var(--muted); font-size: 11px; }
.av td button { width: 100%; min-height: 34px; border: 0; background: var(--surface); cursor: pointer; color: var(--muted); font-size: 11.5px; padding: 0 2px; }
.av td button:hover { filter: brightness(.96); }
.av td button[data-s="1"] { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.av td button[data-s="2"] { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.av .sess td { background: var(--surface2); color: var(--accent); font-weight: 700; text-align: left; padding: 2px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line); }
.sw.w { background: var(--warn-soft); } .sw.b { background: var(--bad-soft); }
/* export */
.exp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-top: 10px; }
.exp-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface2); display: flex; flex-direction: column; gap: 6px; }
.exp-card h3 { font-size: 14.5px; font-weight: 700; }
.exp-card p { font-size: 12.5px; color: var(--muted); flex: 1; }
.exp-card .row { gap: 8px; }

@media (max-width: 900px) {
  .two-col, .tsplit { grid-template-columns: minmax(0, 1fr); }
  .tlist { max-height: 300px; }
  .brand h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

.editbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 10px; font-size: 13px; line-height: 1.7; }
.editbar .lg { display: inline-block; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.editbar .lg.ok { background: var(--good-soft); color: var(--good); } .editbar .lg.warn { background: var(--warn-soft); color: var(--warn); } .editbar .lg.bad { background: var(--bad-soft); color: var(--bad); }
td[draggable="true"] { cursor: grab; } td[draggable="true"]:active { cursor: grabbing; }
td[data-es] { transition: outline-color .1s; }
td.dz-ok { outline: 2px dashed var(--good); outline-offset: -3px; background: var(--good-soft) !important; }
td.dz-warn { outline: 2px dashed var(--warn); outline-offset: -3px; background: var(--warn-soft) !important; }
td.dz-bad { outline: 2px dashed var(--bad); outline-offset: -3px; opacity: .6; }
td.dz-over { outline-style: solid; outline-width: 3px; }
td.dz-src, td.picked { outline: 3px solid var(--accent); outline-offset: -3px; opacity: .75; }
</style>


<script src="config.js"></script>
<div class="wrap">
  <div id="hdr"></div>
  <div id="tabs" class="tabs" role="tablist"></div>
  <div id="main"></div>
  <div id="foot" class="foot"></div>
</div>
<div id="busy" class="busy" hidden>
  <div class="card" role="status" aria-live="polite">
    <h2 id="busytitle" style="font-size:16px">កំពុងរៀបចំកាលវិភាគ…</h2>
    <div class="bar"><span id="busybar"></span></div>
    <p class="hint" id="busymsg">កំពុងចាប់ផ្តើម</p>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="copyhost"></div>

<script>
/* ===== Timetable solver v2 (pure, no DOM) =====
   Single shift. Every class studies in a morning session (am periods) and an
   afternoon session (pm periods) each day.  slot = day*Pt + p, p in [0,Pt), p<am => morning.
   input: {
     days, am, pm, maxPerDay,
     subjects:[{pref:'early'|'late'|'any'}],
     classes:[{grade, key, hours:[per subject index]}],
     teachers:[{hours, subjects:[idx], block:[W values: 0 free, 1 avoid, 2 blocked],
                groups:[class group keys the teacher may teach, [] = all], pinned:[class idx fixed for the teacher], only:bool,
                sc:{subject idx: {pinned:[class idx], groups:[keys], only:bool}}  (per-subject version, overrides the three teacher-wide fields)}]
   }
*/
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

async function solveTimetable(inp, opts) {
  opts = opts || {};
  var yieldFn = opts.yield || function () { return Promise.resolve(); };
  var progress = opts.onProgress || function () {};
  var D = inp.days, AM = inp.am, PM = inp.pm, Pt = AM + PM, W = D * Pt;
  var maxPerDay = inp.maxPerDay;
  var nC = inp.classes.length, nT = inp.teachers.length, nS = inp.subjects.length;
  var warnings = [], i, d, p;

  var slotDay = new Int16Array(W), slotP = new Int16Array(W);
  for (i = 0; i < W; i++) { slotDay[i] = (i / Pt) | 0; slotP[i] = i - slotDay[i] * Pt; }

  /* ---------- 1. demands ---------- */
  var demands = [];
  inp.classes.forEach(function (cl, c) {
    var hrs = cl.hours.slice();
    var tot = hrs.reduce(function (a, b) { return a + (b || 0); }, 0), dropped = 0;
    for (var s = nS - 1; s >= 0 && tot > W; s--) { while (hrs[s] > 0 && tot > W) { hrs[s]--; tot--; dropped++; } }
    if (dropped) warnings.push({ type: 'overflow', c: c, dropped: dropped });
    hrs.forEach(function (h, s) { if (h > 0) demands.push({ c: c, s: s, h: h }); });
  });

  /* ---------- 2. teacher availability ---------- */
  var block = inp.teachers.map(function (t) {
    var b = new Uint8Array(W); for (var k = 0; k < W; k++) b[k] = t.block[k] || 0; return b;
  });
  var cap = inp.teachers.map(function (t, ti) {
    var avail = 0, days = 0;
    for (var dd = 0; dd < D; dd++) {
      var n = 0; for (var pp = 0; pp < Pt; pp++) if (block[ti][dd * Pt + pp] < 2) n++;
      avail += n; if (n) days++;
    }
    return Math.max(0, Math.min(t.hours, Math.floor(avail * 0.92), days * maxPerDay));
  });

  /* ---------- 3. assign teachers to (class, subject) ---------- */
  var load = new Array(nT).fill(0);
  var bySubj = []; for (i = 0; i < nS; i++) bySubj.push([]);
  inp.teachers.forEach(function (t, ti) { t.subjects.forEach(function (s) { if (s >= 0 && s < nS) bySubj[s].push(ti); }); });
  var rem = {}; demands.forEach(function (dm) { rem[dm.c * nS + dm.s] = dm.h; });
  var rng = mulberry32(opts.seed || 20260101);
  var affinity = {}, assigns = [], unassigned = [], pinRecs = [];
  function giveTo(t, c, s, n) { assigns.push({ c: c, s: s, t: t, n: n }); load[t] += n; rem[c * nS + s] -= n; affinity[t + '|' + inp.classes[c].key + '|' + s] = 1; }
  /* per (teacher, subject): classes fixed by the school, allowed class levels, and "only these classes" */
  function tsInfo(t, s) {
    var T = inp.teachers[t], e = T.sc && T.sc[s];
    return e || { pinned: T.pinned || [], groups: T.groups || [], only: !!T.only };
  }
  function onlyTS(t, s) { var e = tsInfo(t, s); return !!e.only && (e.pinned || []).length > 0; }
  function groupOk(t, c, s) { var g = tsInfo(t, s).groups; return !g || !g.length || g.indexOf(inp.classes[c].key) >= 0; }
  /* A. classes the school fixed for a teacher (per subject) come first */
  inp.teachers.forEach(function (t, ti) {
    t.subjects.forEach(function (s) {
      (tsInfo(ti, s).pinned || []).forEach(function (c) {
        var r = rem[c * nS + s]; if (!(r > 0)) return;
        var n = Math.min(r, cap[ti] - load[ti]); if (n > 0) giveTo(ti, c, s, n);
        if (n < r) pinRecs.push({ t: ti, c: c, s: s, missing: r - n });
      });
    });
  });
  var pinUnmet = pinRecs; /* the chosen teacher could not take every hour of these (hours or availability ran out) */
  /* B. everything that is still unassigned */
  var dl = [];
  demands.forEach(function (dm) {
    var r = rem[dm.c * nS + dm.s]; if (!(r > 0)) return;
    var cands = 0; bySubj[dm.s].forEach(function (t) { if (!onlyTS(t, dm.s) && groupOk(t, dm.c, dm.s)) cands++; });
    dl.push({ c: dm.c, s: dm.s, h: r, cands: cands, r: rng() });
  });
  dl.sort(function (a, b) { return a.cands - b.cands || b.h - a.h || a.r - b.r; });
  dl.forEach(function (dm) {
    var remaining = dm.h, key = inp.classes[dm.c].key;
    var cands = bySubj[dm.s].filter(function (t) { return !onlyTS(t, dm.s) && groupOk(t, dm.c, dm.s) && cap[t] - load[t] > 0; });
    var whole = cands.filter(function (t) { return cap[t] - load[t] >= remaining; });
    function give(t, n) { giveTo(t, dm.c, dm.s, n); remaining -= n; }
    if (whole.length) {
      var bt = -1, bs = Infinity;
      whole.forEach(function (t) {
        var v = (load[t] + remaining) / Math.max(1, cap[t]);
        if (affinity[t + '|' + key + '|' + dm.s]) v -= 0.08;
        v += rng() * 0.02;
        if (v < bs) { bs = v; bt = t; }
      });
      give(bt, remaining);
    } else {
      cands.sort(function (a, b) { return (cap[b] - load[b]) - (cap[a] - load[a]); });
      for (var k = 0; k < cands.length && remaining > 0; k++) give(cands[k], Math.min(remaining, cap[cands[k]] - load[cands[k]]));
    }
    if (remaining > 0) unassigned.push({ c: dm.c, s: dm.s, missing: remaining });
  });
  /* ---------- 4. lessons + state ---------- */
  var lessonsRaw = [];
  assigns.forEach(function (a) { for (var k = 0; k < a.n; k++) lessonsRaw.push({ c: a.c, s: a.s, t: a.t }); });
  var nL = lessonsRaw.length;
  var lc = new Int32Array(nL), ls = new Int32Array(nL), lt = new Int32Array(nL);
  lessonsRaw.forEach(function (l, k) { lc[k] = l.c; ls[k] = l.s; lt[k] = l.t; });
  var prefArr = inp.subjects.map(function (s) { return s.pref === 'early' ? 1 : s.pref === 'late' ? 2 : 0; });

  var lslot, clsAt, tAt, tDay;
  function resetState() {
    lslot = new Int32Array(nL).fill(-1);
    clsAt = new Int32Array(nC * W).fill(-1);
    tAt = new Int32Array(nT * W).fill(-1);
    tDay = new Int16Array(nT * D);
  }
  function place(L, slot) { clsAt[lc[L] * W + slot] = L; tAt[lt[L] * W + slot] = L; tDay[lt[L] * D + slotDay[slot]]++; lslot[L] = slot; }
  function unplace(L) { var slot = lslot[L]; clsAt[lc[L] * W + slot] = -1; tAt[lt[L] * W + slot] = -1; tDay[lt[L] * D + slotDay[slot]]--; lslot[L] = -1; }

  /* ----- cost terms (each a pure function of the current state) ----- */
  function lessonCost(L) {
    var slot = lslot[L], v = 0;
    if (block[lt[L]][slot] === 1) v += 45;
    var pr = prefArr[ls[L]], q = slotP[slot];
    if (pr === 1) v += q * 1.5; else if (pr === 2) v += (Pt - 1 - q) * 1.5;
    return v;
  }
  function classDayCost(c, dd) {
    var v = 0, tot = 0;
    for (var sess = 0; sess < 2; sess++) {
      var base = c * W + dd * Pt + (sess ? AM : 0), len = sess ? PM : AM, first = -1, last = -1, cnt = 0;
      for (var q = 0; q < len; q++) if (clsAt[base + q] >= 0) { if (first < 0) first = q; last = q; cnt++; }
      if (cnt) { v += (last - first + 1 - cnt) * 9 + first * 3; tot += cnt; }
    }
    return v + tot * tot * 0.4;
  }
  function teacherDayCost(t, dd) {
    var v = 0, n = 0, used = 0;
    for (var sess = 0; sess < 2; sess++) {
      var base = t * W + dd * Pt + (sess ? AM : 0), len = sess ? PM : AM, first = -1, last = -1, cnt = 0;
      for (var q = 0; q < len; q++) if (tAt[base + q] >= 0) { if (first < 0) first = q; last = q; cnt++; }
      if (cnt) { used++; n += cnt; v += (last - first + 1 - cnt) * 6; }
    }
    if (used === 2) v += 10;
    return v + n * n * 1.2;
  }
  function subjDayCost(c, s, dd) {
    var k = 0, adj = false, prev = false, base = c * W + dd * Pt;
    for (var q = 0; q < Pt; q++) {
      var o = clsAt[base + q], same = o >= 0 && ls[o] === s;
      if (same) { k++; if (prev) adj = true; }
      prev = same;
    }
    return k <= 1 ? 0 : k === 2 ? (adj ? 10 : 70) : 300;
  }
  function pushU(arr, x) { for (var k = 0; k < arr.length; k++) if (arr[k] === x) return; arr.push(x); }
  /* cost of everything a move of the given lessons across the given days can touch */
  function localCost(Ls, days) {
    var v = 0, i1, j, cd = [], td = [], sd = [], L;
    for (i1 = 0; i1 < Ls.length; i1++) {
      L = Ls[i1];
      for (j = 0; j < days.length; j++) {
        pushU(cd, lc[L] * D + days[j]); pushU(td, lt[L] * D + days[j]); pushU(sd, (lc[L] * nS + ls[L]) * D + days[j]);
      }
    }
    for (i1 = 0; i1 < cd.length; i1++) v += classDayCost((cd[i1] / D) | 0, cd[i1] % D);
    for (i1 = 0; i1 < td.length; i1++) v += teacherDayCost((td[i1] / D) | 0, td[i1] % D);
    for (i1 = 0; i1 < sd.length; i1++) { var dd = sd[i1] % D, cs = (sd[i1] / D) | 0; v += subjDayCost((cs / nS) | 0, cs % nS, dd); }
    for (i1 = 0; i1 < Ls.length; i1++) if (lslot[Ls[i1]] >= 0) v += lessonCost(Ls[i1]);
    return v;
  }

  function feasible(L, slot) {
    var t = lt[L];
    return block[t][slot] < 2 && tAt[t * W + slot] < 0 && clsAt[lc[L] * W + slot] < 0 && tDay[t * D + slotDay[slot]] < maxPerDay;
  }
  function bestFree(L) {
    var best = -1, bv = Infinity, beforeByDay = new Array(D);
    for (var slot = 0; slot < W; slot++) {
      if (!feasible(L, slot)) continue;
      var dd = slotDay[slot];
      if (beforeByDay[dd] === undefined) beforeByDay[dd] = localCost([L], [dd]);
      place(L, slot);
      var v = localCost([L], [dd]) - beforeByDay[dd] + rng() * 0.4;
      unplace(L);
      if (v < bv) { bv = v; best = slot; }
    }
    return best;
  }
  var lastMoved = new Int32Array(nL).fill(-100000), evictQueue;
  function eject(L, iter) {
    var c = lc[L], t = lt[L], best = -1, bv = Infinity;
    for (var slot = 0; slot < W; slot++) {
      if (block[t][slot] === 2) continue;
      var oc = clsAt[c * W + slot], ot = tAt[t * W + slot];
      if (ot < 0 && tDay[t * D + slotDay[slot]] >= maxPerDay) continue;
      var conf = 0, pen = 0;
      if (oc >= 0) { conf++; var a1 = iter - lastMoved[oc]; if (a1 < 60) pen += (60 - a1) * 0.6; }
      if (ot >= 0 && ot !== oc) { conf++; var a2 = iter - lastMoved[ot]; if (a2 < 60) pen += (60 - a2) * 0.6; }
      var v = conf * 100 + pen + (block[t][slot] === 1 ? 6 : 0) + rng() * 4;
      if (v < bv) { bv = v; best = slot; }
    }
    if (best < 0) return false;
    var oc2 = clsAt[c * W + best], ot2 = tAt[t * W + best];
    if (oc2 >= 0) { unplace(oc2); evictQueue.push(oc2); }
    if (ot2 >= 0 && ot2 !== oc2) { unplace(ot2); evictQueue.push(ot2); }
    place(L, best); lastMoved[L] = iter;
    return true;
  }
  function countUnplaced() { var n = 0; for (var k = 0; k < nL; k++) if (lslot[k] < 0) n++; return n; }

  /* ---------- 5. construct (with restarts) ---------- */
  var order0 = []; for (i = 0; i < nL; i++) order0.push(i);
  var best = null, attempts = opts.attempts || 5;
  for (var att = 0; att < attempts; att++) {
    resetState(); lastMoved.fill(-100000);
    rng = mulberry32((opts.seed || 20260101) + att * 7919);
    var order = order0.map(function (L) { return { L: L, k: load[lt[L]] / Math.max(1, cap[lt[L]]) * 10 + rng() * 6 }; });
    order.sort(function (a, b) { return b.k - a.k; });
    evictQueue = order.map(function (o) { return o.L; });
    var head = 0, iter = 0, maxIter = opts.maxIter || Math.max(60000, nL * 120);
    while (head < evictQueue.length && iter < maxIter) {
      var L = evictQueue[head++];
      if (head > 4000) { evictQueue = evictQueue.slice(head); head = 0; }
      var slot = bestFree(L);
      if (slot >= 0) place(L, slot); else eject(L, iter);
      iter++;
      if (iter % 400 === 0) { progress(4 + (att * 6) + Math.min(1, head / Math.max(1, nL)) * 6, 'កំពុងចាត់ម៉ោងចូលតារាង…'); await yieldFn(); }
    }
    var un = countUnplaced();
    if (!best || un < best.un) best = { un: un, slots: lslot.slice() };
    if (un === 0) break;
    await yieldFn();
  }
  resetState();
  for (i = 0; i < nL; i++) if (best.slots[i] >= 0) place(i, best.slots[i]);
  rng = mulberry32((opts.seed || 20260101) + 99991);

  /* ---------- 6. improve (simulated annealing, exact local deltas) ---------- */
  var iters = opts.improveIters || Math.min(220000, Math.max(70000, nL * 150));
  var T0 = 8, T1 = 0.2;
  for (var it = 0; it < iters; it++) {
    var T = T0 * Math.pow(T1 / T0, it / iters);
    var c = (rng() * nC) | 0;
    var a = (rng() * W) | 0, b = (rng() * W) | 0;
    if (a === b) continue;
    var la = clsAt[c * W + a], lb = clsAt[c * W + b];
    if (la < 0 && lb < 0) continue;
    var Ls = [], days = [slotDay[a]]; if (slotDay[b] !== slotDay[a]) days.push(slotDay[b]);
    if (la >= 0) Ls.push(la); if (lb >= 0) Ls.push(lb);
    var before = localCost(Ls, days);
    if (la >= 0) unplace(la); if (lb >= 0) unplace(lb);
    var pa = false, pb = false, ok = true;
    if (la >= 0) { if (feasible(la, b)) { place(la, b); pa = true; } else ok = false; }
    if (ok && lb >= 0) { if (feasible(lb, a)) { place(lb, a); pb = true; } else ok = false; }
    var accept = false;
    if (ok) { var dlt = localCost(Ls, days) - before; accept = dlt <= 0 || rng() < Math.exp(-dlt / T); }
    if (!accept) {
      if (pb) unplace(lb); if (pa) unplace(la);
      if (la >= 0) place(la, a); if (lb >= 0) place(lb, b);
    }
    if (it % 3000 === 0) { progress(20 + (it / iters) * 78, 'កំពុងកែលម្អតារាងឱ្យល្អប្រសើរ…'); await yieldFn(); }
  }

  /* ---------- 7. result ---------- */
  var lessons = [], unplacedList = [];
  for (i = 0; i < nL; i++) {
    if (lslot[i] >= 0) lessons.push({ c: lc[i], s: ls[i], t: lt[i], slot: lslot[i] });
    else unplacedList.push({ c: lc[i], s: ls[i], t: lt[i] });
  }
  var tGaps = 0, cGaps = 0, sameDay = 0, avoidHits = 0, t2, c2, s2, sess;
  for (t2 = 0; t2 < nT; t2++) for (d = 0; d < D; d++) for (sess = 0; sess < 2; sess++) {
    var base = t2 * W + d * Pt + (sess ? AM : 0), len = sess ? PM : AM, first = -1, last = -1, cnt = 0;
    for (p = 0; p < len; p++) if (tAt[base + p] >= 0) { if (first < 0) first = p; last = p; cnt++; }
    if (cnt) tGaps += last - first + 1 - cnt;
  }
  for (c2 = 0; c2 < nC; c2++) for (d = 0; d < D; d++) {
    for (sess = 0; sess < 2; sess++) {
      var b2 = c2 * W + d * Pt + (sess ? AM : 0), l2 = sess ? PM : AM, f2 = -1, e2 = -1, n2 = 0;
      for (p = 0; p < l2; p++) if (clsAt[b2 + p] >= 0) { if (f2 < 0) f2 = p; e2 = p; n2++; }
      if (n2) cGaps += e2 - f2 + 1 - n2;
    }
    for (s2 = 0; s2 < nS; s2++) { var kk = 0; for (p = 0; p < Pt; p++) { var o = clsAt[c2 * W + d * Pt + p]; if (o >= 0 && ls[o] === s2) kk++; } if (kk > 1) sameDay += kk - 1; }
  }
  for (i = 0; i < nL; i++) if (lslot[i] >= 0 && block[lt[i]][lslot[i]] === 1) avoidHits++;
  return {
    lessons: lessons, unplaced: unplacedList, unassigned: unassigned, warnings: warnings, pinUnmet: pinUnmet,
    stats: { total: nL, placed: lessons.length, tGaps: tGaps, cGaps: cGaps, sameDay: sameDay, avoidHits: avoidHits,
      demand: demands.reduce(function (a, x) { return a + x.h; }, 0) }
  };
}

if (typeof module !== 'undefined') module.exports = { solveTimetable: solveTimetable };

/* ===== Data model, sample data, converters (v2) ===== */
var KH_DIGITS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
function toKh(n) { return String(n).replace(/[0-9]/g, function (d) { return KH_DIGITS[+d]; }); }
var SECTION_LETTERS = ['ក','ខ','គ','ឃ','ង','ច','ឆ','ជ','ឈ','ញ','ដ','ឋ','ឌ','ឍ','ណ','ត'];
var DAY_NAMES = ['ច័ន្ទ','អង្គារ','ពុធ','ព្រហស្បតិ៍','សុក្រ','សៅរ៍'];
var GRADES = [7, 8, 9, 10, 11, 12];

  { key: '7', grade: 7, label: 'ទី ៧' }, { key: '8', grade: 8, label: 'ទី ៨' }, { key: '9', grade: 9, label: 'ទី ៩' },

/* ===================== manual editing: drag & drop / click to move or swap lessons ===================== */
function eArr(kind, id) { return (kind === 'c' ? IDX.byC : IDX.byT).get(id) || null; }

/* try moving the lesson of entity (class or teacher) from slot `from` to slot `to`; an occupied target swaps */
function evalMove(kind, id, from, to) {
  var r = { ok: false, hard: [], warn: [], moved: [] };
  var arr = eArr(kind, id); if (!arr || from === to) return r;
  var L = arr[from], M = arr[to]; if (!L) return r;
  r.moved = [[L, to]]; if (M) r.moved.push([M, from]);
  var P = Pt();
  r.moved.forEach(function (m) {
    var l = m[0], n = m[1], c = IDX.c.get(l.c), t = IDX.t.get(l.t);
    var ca = IDX.byC.get(l.c), ta = IDX.byT.get(l.t), oc = ca && ca[n], ot = ta && ta[n];
    if (oc && oc !== L && oc !== M) r.hard.push('ថ្នាក់ ' + c.name + ' មានម៉ោង «' + IDX.s.get(oc.s).name + '» នៅម៉ោងនោះរួចហើយ');
    if (ot && ot !== L && ot !== M) r.hard.push('គ្រូ ' + t.name + ' កំពុងបង្រៀនថ្នាក់ ' + IDX.c.get(ot.c).name + ' នៅម៉ោងនោះ');
    var d = Math.floor(n / P), p = n - d * P, v = (t.av && t.av[d + ':' + p]) || 0;
    if ((t.off || []).indexOf(d) >= 0) v = 2;
    var msg = v === 2 ? 'គ្រូ ' + t.name + ' មិនអាចបង្រៀនម៉ោងនេះ' : v === 1 ? 'គ្រូ ' + t.name + ' មិនចង់បានម៉ោងនេះ' : '';
    if (msg && r.warn.indexOf(msg) < 0) r.warn.push(msg);
  });
  r.ok = !r.hard.length; return r;
}

function recomputeStats() {
  var sc = state.schedule, D = sc.days, P = sc.am + sc.pm, W = D * P, AM = sc.am, PM = sc.pm, tA = {}, cA = {}, avoid = 0;
  sc.lessons.forEach(function (l) {
    (tA[l[2]] || (tA[l[2]] = new Array(W).fill(0)))[l[3]] = 1;
    (cA[l[0]] || (cA[l[0]] = new Array(W).fill(0)))[l[3]] = l[1] + 1;
    var t = IDX.t.get(l[2]), d = Math.floor(l[3] / P), p = l[3] - d * P;
    if (t && t.av && t.av[d + ':' + p] === 1) avoid++;
  });
  function gaps(a, d) {
    var g = 0;
    [[0, AM], [AM, AM + PM]].forEach(function (r) {
      var f = -1, e = -1, n = 0;
      for (var p = r[0]; p < r[1]; p++) if (a[d * P + p]) { if (f < 0) f = p; e = p; n++; }
      if (n) g += e - f + 1 - n;
    });
    return g;
  }
  var tG = 0, cG = 0, same = 0, d, k;
  Object.keys(tA).forEach(function (id) { for (d = 0; d < D; d++) tG += gaps(tA[id], d); });
  Object.keys(cA).forEach(function (id) {
    for (d = 0; d < D; d++) {
      cG += gaps(cA[id], d);
      var cnt = {}; for (k = 0; k < P; k++) { var s = cA[id][d * P + k]; if (s) cnt[s] = (cnt[s] || 0) + 1; }
      Object.keys(cnt).forEach(function (s2) { if (cnt[s2] > 1) same += cnt[s2] - 1; });
    }
  });
  sc.stats = Object.assign({}, sc.stats, { tGaps: tG, cGaps: cG, sameDay: same, avoidHits: avoid, placed: sc.lessons.length });
}

function doMove(kind, id, from, to) {
  var r = evalMove(kind, id, from, to);
  if (!r.moved.length) return false;
  if (!r.ok) { toast(r.hard[0] + ' · មិនអាចផ្លាស់ប្តូរបាន', 'err'); return false; }
  var sc = state.schedule, hist = [];
  r.moved.forEach(function (m) {
    var l = m[0];
    for (var i = 0; i < sc.lessons.length; i++) { var x = sc.lessons[i]; if (x[0] === l.c && x[1] === l.s && x[2] === l.t && x[3] === l.slot) { hist.push([i, x[3], m[1]]); break; } }
  });
  hist.forEach(function (h) { sc.lessons[h[0]][3] = h[2]; });
  (ui.undo = ui.undo || []).push(hist.map(function (h) { return [h[0], h[1]]; }));
  if (ui.undo.length > 100) ui.undo.shift();
  sc.manual = (sc.manual || 0) + 1;
  recomputeStats(); ui.pick = null; touch(false); render();
  var swap = r.moved.length > 1;
  toast((swap ? 'បានប្តូរម៉ោងទាំងពីរ' : 'បានផ្លាស់ប្តូរម៉ោង') + (r.warn.length ? ' ⚠ ' + r.warn[0] : ''), r.warn.length ? 'err' : '');
  return true;
}
function undoMove() {
  var h = ui.undo && ui.undo.pop(); if (!h || !schedValid()) return;
  var sc = state.schedule; h.forEach(function (x) { if (sc.lessons[x[0]]) sc.lessons[x[0]][3] = x[1]; });
  sc.manual = Math.max(0, (sc.manual || 1) - 1); recomputeStats(); touch(false); render(); toast('បានមិនធ្វើវិញ');
}

function eMark(kind, id, from) {
  document.querySelectorAll('td[data-ek="' + kind + '"][data-eid="' + id + '"]').forEach(function (td) {

function addClasses() {
  var g = clampInt(document.getElementById('qaGrade').value, 7, 12, 7), n = clampInt(document.getElementById('qaCount').value, 1, 20, 1);
  var track = g >= 10 ? document.getElementById('qaTrack').value : '';

  for (var k = 0; k < n; k++) state.classes.push({ id: newId('class'), name: toKh(g) + (SECTION_LETTERS[existing + k] || toKh(existing + k + 1)), grade: g, track: track });
  touch(true); render(); toast('បានបន្ថែម ' + kh(n) + ' ថ្នាក់');
}
function importTSV() {
  var txt = document.getElementById('tsv').value, lines = txt.split(/\r?\n/).filter(function (l) { return l.trim(); }), added = 0, unknown = 0, unkCls = 0, byName = {};
  var am = state.settings.amPeriods, P = Pt(), D = state.settings.days;
  state.subjects.forEach(function (s) { byName[s.name.trim()] = s.id; if (s.abbr) byName[s.abbr.trim()] = s.id; });
  lines.forEach(function (line) {
    var f = line.split('\t'); if (!f[0] || !f[0].trim()) return;
    var subs = (f[1] || '').split(/[,;|]/).map(function (x) { return x.trim(); }).filter(Boolean).map(function (x) { if (byName[x] == null) unknown++; return byName[x]; }).filter(function (x) { return x != null; });
    var t = { id: newId('teacher'), name: f[0].trim(), subjects: subs, hours: clampInt(f[2], 1, 40, 18), off: [], av: {}, groups: [], classes: [], only: false };
    t.sc = {};
    var colCls = (f[4] || '').trim();
    function addCls(sid, names) { names.forEach(function (nm) { var c = state.classes.find(function (x) { return x.name === nm; }); if (!c) { unkCls++; return; } var e = scGet(t, sid, true); if (e.classes.indexOf(c.id) < 0) e.classes.push(c.id); }); }
    if (colCls) {
      if (colCls.indexOf(':') >= 0) colCls.split(/;|\|/).forEach(function (part) {
        var kv = part.split(':'); if (kv.length < 2) return; var sid = byName[kv[0].trim()]; if (sid == null || t.subjects.indexOf(sid) < 0) { unkCls++; return; }
        addCls(sid, kv[1].split(/[,\s]+/).map(function (x) { return x.trim(); }).filter(Boolean));
      });
      else t.subjects.forEach(function (sid) { addCls(sid, colCls.split(/[,;|]/).map(function (x) { return x.trim(); }).filter(Boolean)); });
    }
    var note = f[3] || '', d, p;
    if (/ព្រឹក/.test(note)) for (d = 0; d < D; d++) for (p = 0; p < am; p++) setAv(t, d, p, 1);
    if (/រសៀល/.test(note)) for (d = 0; d < D; d++) for (p = am; p < P; p++) setAv(t, d, p, 1);
    var m = /ម៉ោងទី\s*([0-9០-៩])/.exec(note);
    if (m) { var num = parseInt(String(m[1]).replace(/[០-៩]/g, function (c) { return KH_DIGITS.indexOf(c); }), 10) - 1; if (num >= 0 && num < am) for (d = 0; d < D; d++) setAv(t, d, num, 1); }
    state.teachers.push(t); added++;
  });

}
function remapAv(o, n) {
  state.teachers.forEach(function (t) {
    var nv = {};
    Object.keys(t.av || {}).forEach(function (k) {
      var q = k.split(':'), d = +q[0], p = +q[1], sess = p < o.am ? 0 : 1, i = sess ? p - o.am : p;

function onChange(e) {

    else if (k === 'pmPeriods') st.pmPeriods = clampInt(v, 2, 6, 5);

    if (st.breakAfter >= Math.min(st.amPeriods, st.pmPeriods)) st.breakAfter = 0;

    if (structural) { remapAv(old, { days: st.days, am: st.amPeriods, pm: st.pmPeriods }); if (state.schedule) { state.schedule = null; toast('កាលវិភាគចាស់ត្រូវបានលុប សូមបង្កើតថ្មី'); } }

  }

    var c = state.classes.find(function (x) { return x.id === +el.getAttribute('data-id'); }), cf = el.getAttribute('data-cf');

  }

async function loadSaved() {
  var raw = null, gs = (typeof Gate !== 'undefined') ? Gate.store() : null;
  if (gs) {
    dbDoc = gs; ui.usingDb = true;
    try { var gsnap = await gs.get(); if (gsnap.exists) raw = gsnap.data().json; } catch (e) { dbDoc = null; ui.usingDb = false; }
  }
  try {
    var c = gs ? null : window.claude;

      var db = await c.use('db');
      if (db) {
        dbDoc = db.doc('school/state'); ui.usingDb = true;
        try { var snap = await dbDoc.get(); if (snap.exists) raw = snap.data().json; } catch (e) { dbDoc = null; ui.usingDb = false; }
      }

    }
  } catch (e) { dbDoc = null; ui.usingDb = false; }

      var parsed = JSON.parse(raw), wasOld = parsed.v !== 2;
      state = normalizeState(parsed); resetUiRefs();
      if (wasOld) toast('បានបំប្លែងទិន្នន័យចាស់ទៅទម្រង់ថ្មី សូមបង្កើតកាលវិភាគឡើងវិញ');

    } catch (e) {}

}
function boot() {
