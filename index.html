<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>កាលវិភាគមធ្យមសិក្សា</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap">
<style>
/* Layout: one wide column. Header with the single primary action, a tab rail for data entry, and a timetable workspace whose master grid scrolls inside its own frame. */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --surface2: #eef2f8; --ink: #16213a; --muted: #5a6580;
  --line: #d9e0ec; --line2: #e8edf5;
  --accent: #1c4fa0; --accent-ink: #ffffff; --accent-soft: #e3ecfb;
  --good: #17784a; --good-soft: #dff3e8; --warn: #8f5400; --warn-soft: #fdeccc; --bad: #b3261e; --bad-soft: #fbe0dd;
  --sj-bg-s: 62%; --sj-bg-l: 89%; --sj-fg-s: 55%; --sj-fg-l: 21%;
  --f-body: 'Battambang', 'Noto Sans Khmer', 'Leelawadee UI', system-ui, sans-serif;
  --f-display: 'Moul', 'Battambang', 'Noto Sans Khmer', system-ui, sans-serif;
  --shadow: 0 1px 2px rgba(20, 33, 58, .06), 0 4px 14px rgba(20, 33, 58, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #151d31; --surface2: #1b2540; --ink: #e7ecf8; --muted: #97a3bf;
    --line: #2a3656; --line2: #222d4a;
    --accent: #7fa8ff; --accent-ink: #0b1630; --accent-soft: #1d2d55;
    --good: #6fd6a0; --good-soft: #15332a; --warn: #f0b45a; --warn-soft: #3a2d12; --bad: #ff8f86; --bad-soft: #3c1c1a;
    --sj-bg-s: 34%; --sj-bg-l: 25%; --sj-fg-s: 70%; --sj-fg-l: 88%;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #151d31; --surface2: #1b2540; --ink: #e7ecf8; --muted: #97a3bf;
  --line: #2a3656; --line2: #222d4a;
  --accent: #7fa8ff; --accent-ink: #0b1630; --accent-soft: #1d2d55;
  --good: #6fd6a0; --good-soft: #15332a; --warn: #f0b45a; --warn-soft: #3a2d12; --bad: #ff8f86; --bad-soft: #3c1c1a;
  --sj-bg-s: 34%; --sj-bg-l: 25%; --sj-fg-s: 70%; --sj-fg-l: 88%;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.7 var(--f-body); -webkit-text-size-adjust: 100%; }
.wrap {
  max-width: 1480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 56px;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.hdr { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding-bottom: 14px; }
.brand { min-width: 0; }
.brand h1 { font: 400 22px/1.7 var(--f-display); color: var(--accent); }
.brand p { color: var(--muted); font-size: 13px; }
.hdr-act { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* buttons & controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 4px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface2); }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; min-height: 42px; padding: 6px 20px; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn.sm { min-height: 30px; padding: 2px 10px; font-size: 13px; }
.btn.icon { min-width: 36px; padding: 4px 8px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 3px 12px; min-height: 30px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tag { display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500; background: var(--surface2); color: var(--muted); }
.tag.ok { background: var(--good-soft); color: var(--good); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
input[type="text"], input[type="number"], input[type="time"], select, textarea {
  width: 100%; min-height: 36px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
}
textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
input[type="number"] { font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 500; }

/* tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 16px; scrollbar-width: thin; }
.tabs button { border: 0; background: transparent; padding: 8px 16px; min-height: 42px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button small { margin-left: 6px; font-weight: 500; color: var(--muted); }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.panel + .panel { margin-top: 16px; }
.panel h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.row.between { justify-content: space-between; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 16px; }
.hint { color: var(--muted); font-size: 13px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 14px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.empty-note { color: var(--muted); padding: 28px 12px; text-align: center; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.stat b { display: block; font-size: 21px; line-height: 1.5; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { font-size: 12.5px; color: var(--muted); }
.stat.bad b { color: var(--bad); }
.stat.good b { color: var(--good); }
details.issues { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 14px; margin-bottom: 14px; }
details.issues summary { cursor: pointer; font-weight: 600; }
details.issues ul { margin: 6px 0 2px; padding-left: 20px; }

/* tables */
.scroll { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { padding: 4px 8px; border-bottom: 1px solid var(--line2); text-align: left; vertical-align: middle; }
.tbl thead th { background: var(--surface2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.tbl td input, .tbl td select { min-height: 32px; }
.tbl td.num input { width: 64px; text-align: center; }
.tbl tfoot td { font-weight: 600; background: var(--surface2); font-variant-numeric: tabular-nums; }
.tbl td.num { text-align: center; }
.over { color: var(--bad); }

/* subject chips */
.sj { --h: 210; background: hsl(var(--h) var(--sj-bg-s) var(--sj-bg-l)); color: hsl(var(--h) var(--sj-fg-s) var(--sj-fg-l)); border-radius: 6px; }

/* master grid */
.master-scroll { max-height: min(72vh, 900px); }
.master { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.master th, .master td { padding: 0; border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); background: var(--surface); }
.master thead th { position: sticky; z-index: 3; text-align: center; font-size: 12.5px; font-weight: 600; background: var(--surface2); }
.master thead tr:first-child th { top: 0; height: 32px; }
.master thead tr.sessrow th { top: 32px; height: 22px; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); white-space: nowrap; overflow: hidden; }
.master thead tr.sessrow th.pm { background: var(--surface2); color: var(--muted); }
.master thead tr.timerow th { top: 54px; height: 34px; font-weight: 500; color: var(--muted); line-height: 1.15; }
.master thead tr.timerow th b { display: block; font-size: 12.5px; color: var(--fg); }
.master thead tr.timerow th small { display: block; font-size: 10px; }
.master .corner { left: 0; z-index: 5; width: 96px; min-width: 96px; text-align: left; padding-left: 10px; }
.master .rh { position: sticky; left: 0; z-index: 2; width: 96px; min-width: 96px; max-width: 96px; text-align: left; padding: 0 8px; font-weight: 600; font-size: 13px; background: var(--surface2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.master .ds { border-left: 2px solid var(--line); }
.master .dayh.ds { border-left-width: 3px; }
.master .dayh.d1 { background: var(--accent-soft); }
.master td.cell { width: 60px; min-width: 60px; height: 46px; padding: 2px; cursor: pointer; }
.master td.empty { cursor: default; background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line2) 6px 7px); }
.cell .sj { height: 100%; padding: 1px 4px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; line-height: 1.35; }
.cell .sj b { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .sj i { font-style: normal; font-size: 10.5px; opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.master td.hl .sj { outline: 2px solid var(--accent); outline-offset: -2px; box-shadow: 0 0 0 2px var(--surface); }
.master td.dim .sj { opacity: .22; }
.hlbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 10px; }
.hlbar[hidden] { display: none; }

/* week grids (teacher / class view) */
.week { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; table-layout: fixed; }
.week th, .week td { border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); padding: 4px; background: var(--surface); vertical-align: middle; }
.week thead th { background: var(--surface2); text-align: center; font-weight: 600; }
.week .time { width: 112px; background: var(--surface2); font-size: 12.5px; text-align: left; line-height: 1.4; padding-left: 10px; }
.week .time small { display: block; color: var(--muted); font-size: 11.5px; }
.week .shifthead td { background: var(--surface2); font-weight: 700; color: var(--accent); font-size: 12.5px; padding: 2px 10px; }
.lesson { padding: 4px 8px; min-height: 48px; display: flex; flex-direction: column; justify-content: center; line-height: 1.4; }
.lesson b { font-weight: 700; font-size: 13px; }
.lesson i { font-style: normal; font-size: 12px; opacity: .85; }
.week td.free { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--line2) 6px 7px); }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 90px; margin-top: 6px; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; font-size: 12px; color: var(--muted); height: 100%; }
.bars span { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }

/* teachers tab */
.tsplit { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
.tlist { max-height: 560px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.titem { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line2); background: transparent; padding: 6px 12px; cursor: pointer; }
.titem:hover { background: var(--surface2); }
.titem[aria-current="true"] { background: var(--accent-soft); }
.titem b { display: block; font-weight: 600; }
.titem small { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 1px 12px; min-height: 30px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip.sm { min-height: 26px; padding: 0 10px; font-size: 12.5px; }
.chip.grp { border-style: dashed; font-weight: 600; }
.chip[disabled] { opacity: .5; cursor: not-allowed; }
.subjbox { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--surface2); }
.clsrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px dashed var(--line2); }


/* teacher availability grid */
.avail { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 560px; table-layout: fixed; }
.avail th, .avail td { border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); padding: 2px; background: var(--surface); }
.avail thead th { background: var(--surface2); text-align: center; padding: 0; }
.avail .time { width: 120px; background: var(--surface2); padding: 0; text-align: left; }
.avail .shifthead td { background: var(--surface2); font-weight: 700; color: var(--accent); font-size: 12.5px; padding: 2px 10px; }
.avh { width: 100%; min-height: 34px; padding: 2px 10px; border: 0; background: transparent; cursor: pointer; font-weight: 600; text-align: inherit; line-height: 1.35; }
.avh:hover { background: var(--accent-soft); }
.avh small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.av { width: 100%; min-height: 36px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; background: transparent; font-size: 12.5px; font-weight: 600; }
.av:hover { border-color: var(--line); background: var(--surface2); }
.av1 { background: var(--warn-soft); color: var(--warn); }
.av2 { background: var(--bad-soft); color: var(--bad); }
.t-warn { color: var(--warn); } .t-bad { color: var(--bad); }

/* export panel */
.exports { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px 16px; }
.exrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 10px; background: var(--surface2); }
.exrow > div:first-child { min-width: 0; }
.exrow b { display: block; font-weight: 700; }
.exrow span { color: var(--muted); font-size: 12.5px; }

/* overlays */
.busy { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(10, 16, 32, .55); padding: 16px; }
.busy[hidden] { display: none; }
.busy .card { width: min(420px, 100%); background: var(--surface); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
.bar { height: 10px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin: 12px 0 8px; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.toast { pointer-events: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 8px 18px; border-radius: 10px; max-width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); }
.toast[hidden] { display: none; }
.toast.err { background: var(--bad); color: #fff; }
.copybox { position: fixed; inset: 0; z-index: 55; background: rgba(10, 16, 32, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.copybox .card { width: min(640px, 100%); background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.foot { margin-top: 24px; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 16px; }

/* teacher availability grid */
.av { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 520px; table-layout: fixed; }
.av th, .av td { border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); padding: 0; text-align: center; font-size: 12px; background: var(--surface); }
.av thead th { background: var(--surface2); font-weight: 600; padding: 0; }
.av thead th button, .av th.pt button { width: 100%; border: 0; background: transparent; cursor: pointer; font-weight: 600; min-height: 32px; padding: 2px 6px; text-align: inherit; }
.av thead th button:hover, .av th.pt button:hover { background: var(--accent-soft); }
.av th.pt { width: 120px; background: var(--surface2); text-align: left; line-height: 1.35; }
.av th.pt button { text-align: left; font-weight: 500; padding-left: 8px; }
.av th.pt small { display: block; color: var(--muted); font-size: 11px; }
.av td button { width: 100%; min-height: 34px; border: 0; background: var(--surface); cursor: pointer; color: var(--muted); font-size: 11.5px; padding: 0 2px; }
.av td button:hover { filter: brightness(.96); }
.av td button[data-s="1"] { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.av td button[data-s="2"] { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.av .sess td { background: var(--surface2); color: var(--accent); font-weight: 700; text-align: left; padding: 2px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line); }
.sw.w { background: var(--warn-soft); } .sw.b { background: var(--bad-soft); }
/* export */
.exp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-top: 10px; }
.exp-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--surface2); display: flex; flex-direction: column; gap: 6px; }
.exp-card h3 { font-size: 14.5px; font-weight: 700; }
.exp-card p { font-size: 12.5px; color: var(--muted); flex: 1; }
.exp-card .row { gap: 8px; }

@media (max-width: 900px) {
  .two-col, .tsplit { grid-template-columns: minmax(0, 1fr); }
  .tlist { max-height: 300px; }
  .brand h1 { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

.editbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 10px; font-size: 13px; line-height: 1.7; }
.editbar .lg { display: inline-block; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.editbar .lg.ok { background: var(--good-soft); color: var(--good); } .editbar .lg.warn { background: var(--warn-soft); color: var(--warn); } .editbar .lg.bad { background: var(--bad-soft); color: var(--bad); }
td[draggable="true"] { cursor: grab; } td[draggable="true"]:active { cursor: grabbing; }
td[data-es] { transition: outline-color .1s; }
td.dz-ok { outline: 2px dashed var(--good); outline-offset: -3px; background: var(--good-soft) !important; }
td.dz-warn { outline: 2px dashed var(--warn); outline-offset: -3px; background: var(--warn-soft) !important; }
td.dz-bad { outline: 2px dashed var(--bad); outline-offset: -3px; opacity: .6; }
td.dz-over { outline-style: solid; outline-width: 3px; }
td.dz-src, td.picked { outline: 3px solid var(--accent); outline-offset: -3px; opacity: .75; }
</style>


<script src="config.js"></script>
<div class="wrap">
  <div id="hdr"></div>
  <div id="tabs" class="tabs" role="tablist"></div>
  <div id="main"></div>
  <div id="foot" class="foot"></div>
</div>
<div id="busy" class="busy" hidden>
  <div class="card" role="status" aria-live="polite">
    <h2 id="busytitle" style="font-size:16px">កំពុងរៀបចំកាលវិភាគ…</h2>
    <div class="bar"><span id="busybar"></span></div>
    <p class="hint" id="busymsg">កំពុងចាប់ផ្តើម</p>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="copyhost"></div>

<script>



var PRESET_SCHEDULE = null;
/*__EXPORT__*/
/* ===================== access gate: accounts + admin approval (optional) =====================
   Active only when config.js provides a Firebase config; otherwise the app is an ordinary open page.
   - Everybody registers (name, e-mail, password) and then waits until an admin approves the request.
   - Admins are the e-mails listed in APP_CONFIG.adminEmails (the same list is repeated in firestore.rules,
     which is what really enforces it on the server).

   - Passwords are handled only by Firebase Authentication and are never stored or shown. */
var Gate = (function () {
  var CFG = (typeof window !== 'undefined' && window.APP_CONFIG) || {};
  var B = null;
  var G = { user: null, authKnown: false, profile: undefined, ready: false, started: false, startUid: null, cb: null, unsubP: null, unsubU: null,
    users: [], authMode: 'login', busy: false, view: '', authPainted: null, pinOk: false, confirm: null, cfgErr: null };
  var ELG = null;

  function enabled() { return !!(CFG.backend || (CFG.firebase && CFG.firebase.apiKey)); }
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function K(n) { return typeof kh === 'function' ? kh(n) : String(n); }
  function admins() { return (CFG.adminEmails || []).map(function (s) { return String(s).trim().toLowerCase(); }); }
  function isAdminUser(u) { return !!u && admins().indexOf(String(u.email || '').toLowerCase()) >= 0; }
  function isAdmin() { return enabled() && isAdminUser(G.user); }
  function toast_(m, k) { if (typeof toast === 'function') toast(m, k); }
  function dstr(ts) { if (!ts) return ''; var d = new Date(ts); return K(d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear()); }

  var ERR = {
    'auth/invalid-credential': 'អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ', 'auth/wrong-password': 'អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ', 'auth/user-not-found': 'អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ',
    'auth/email-already-in-use': 'អ៊ីមែលនេះបានចុះឈ្មោះរួចហើយ សូមចូលប្រើវិញ', 'auth/weak-password': 'ពាក្យសម្ងាត់ខ្លីពេក (យ៉ាងតិច ៦ តួ)', 'auth/invalid-email': 'អ៊ីមែលមិនត្រឹមត្រូវ',
    'auth/too-many-requests': 'ព្យាយាមច្រើនដងពេក សូមរង់ចាំបន្តិចហើយសាកម្តងទៀត', 'auth/network-request-failed': 'មិនមានអ៊ីនធឺណិត', 'auth/missing-password': 'សូមបញ្ចូលពាក្យសម្ងាត់',
    'permission-denied': 'គ្មានសិទ្ធិ (ពិនិត្យ firestore.rules)'
  };
  function errMsg(x) { return ERR[x && x.code] || (x && x.message ? x.message : 'មានបញ្ហា សូមសាកម្តងទៀត'); }

  /* ---------- Firebase backend (SDK loaded from Google's CDN only when configured) ---------- */
  function firebaseBackend(cfg) {
    var base = 'https://www.gstatic.com/firebasejs/10.12.2/', m = {};
    var imp = function (f) { return import(base + f); };
    async function ensureProfile(u) {
      try {
        var ref = m.fs.doc(m.db, 'users', u.uid), s = await m.fs.getDoc(ref);
        if (!s.exists()) {
          var doc0 = { email: (u.email || '').toLowerCase(), name: u.displayName || m.pendingName || '', status: 'pending', createdAt: Date.now() };
          if (m.pendingSchool) {
            try { await m.fs.setDoc(ref, Object.assign({ school: m.pendingSchool }, doc0)); }
            catch (x1) { await m.fs.setDoc(ref, doc0); }   /* older rules without the "school" field */
          } else await m.fs.setDoc(ref, doc0);
        }
      } catch (x) { /* shown as "pending" with the error in the console */ if (typeof console !== 'undefined') console.warn('profile', x); }
    }
    return {
      init: async function () {
        var r = await Promise.all([imp('firebase-app.js'), imp('firebase-auth.js'), imp('firebase-firestore.js')]);
        var app = r[0].initializeApp(cfg.firebase); m = { au: r[1], fs: r[2] }; m.auth = r[1].getAuth(app); m.db = r[2].getFirestore(app);
      },
      onAuth: function (cb) {
        return m.au.onAuthStateChanged(m.auth, async function (u) {
          if (u) await ensureProfile(u);
          cb(u ? { uid: u.uid, email: (u.email || '').toLowerCase(), name: u.displayName || '' } : null);
        });
      },
      signIn: function (em, pw) { return m.au.signInWithEmailAndPassword(m.auth, em, pw); },
      signUp: async function (em, pw, name, school) { m.pendingName = name || ''; m.pendingSchool = school || ''; var c = await m.au.createUserWithEmailAndPassword(m.auth, em, pw); if (name) { try { await m.au.updateProfile(c.user, { displayName: name }); } catch (x) {} } },
      reset: function (em) { return m.au.sendPasswordResetEmail(m.auth, em); },
      signOut: function () { return m.au.signOut(m.auth); },
      watchProfile: function (uid, cb) { return m.fs.onSnapshot(m.fs.doc(m.db, 'users', uid), function (s) { cb(s.exists() ? s.data() : null); }, function () { cb(null); }); },
      watchUsers: function (cb, onErr) {
        return m.fs.onSnapshot(m.fs.query(m.fs.collection(m.db, 'users'), m.fs.orderBy('createdAt', 'desc')), function (s) {
          cb(s.docs.map(function (d) { var x = d.data(); return { uid: d.id, email: x.email, name: x.name, school: x.school, status: x.status, createdAt: x.createdAt, approvedAt: x.approvedAt }; }));
        }, function (err) { if (onErr) onErr(err); });
      },
      setStatus: function (uid, status) { return m.fs.updateDoc(m.fs.doc(m.db, 'users', uid), { status: status, approvedAt: Date.now() }); },
      removeUser: async function (uid) { try { await m.fs.deleteDoc(m.fs.doc(m.db, 'users', uid, 'data', 'state')); } catch (x) {} await m.fs.updateDoc(m.fs.doc(m.db, 'users', uid), { status: 'blocked', approvedAt: Date.now() }); },
      storeGet: async function (uid) { var s = await m.fs.getDoc(m.fs.doc(m.db, 'users', uid, 'data', 'state')); return s.exists() ? s.data().json : null; },
      storeSet: function (uid, json) { return m.fs.setDoc(m.fs.doc(m.db, 'users', uid, 'data', 'state'), { json: json, updatedAt: Date.now() }); },
      appGet: async function () { var s = await m.fs.getDoc(m.fs.doc(m.db, 'appcode', 'main')); return s.exists() ? s.data() : null; },
      appSet: function (code) { return m.fs.setDoc(m.fs.doc(m.db, 'appcode', 'main'), { code: code, v: Date.now(), updatedAt: Date.now() }); }
    };
  }

  /* ---------- decision ---------- */
  function decide() {
    if (G.cfgErr) return 'error';
    if (!G.authKnown) return 'wait';
    if (!G.user) return 'auth';
    if (!G.ready) return 'wait';
    if (isAdminUser(G.user)) return 'allow';
    var st = G.profile && G.profile.status;
    if (st === 'approved') return 'allow';
    if (st === 'blocked') return 'blocked';
    return 'pending';
  }
  function evaluate() {
    var d = decide();
    if (d === 'allow') {
      if (!G.started) { G.started = true; G.startUid = G.user.uid; hideOverlay(); if (G.cb) G.cb(); }
      else if (G.user.uid !== G.startUid) { location.reload(); return; }
      else if (G.view !== 'nocode' && G.view !== 'loading') hideOverlay();
      refreshApp(); return;
    }
    paint(d);
  }
  function refreshApp() { try { if (G.started && typeof render === 'function') render(); } catch (x) {} }

  /* ---------- overlay UI ---------- */
  var CSS = '#gate{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}' +
    '#gate[hidden]{display:none}.gt .gcard{width:100%;max-width:440px;margin-top:6vh;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:0 10px 40px rgba(20,30,60,.10)}' +
    '.gt h1{font:400 17px/1.8 var(--f-display);color:var(--accent);margin:0 0 6px}.gt .gsub{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.7}' +
    '.gt label{display:block;margin-bottom:12px}.gt label span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}.gt input[type=text],.gt input[type=email],.gt input[type=password]{width:100%}' +
    '.gt .gmsg{min-height:20px;font-size:13px;margin:4px 0 10px}.gt .gmsg.err{color:var(--bad,#c0392b)}.gt .gmsg.ok{color:var(--ok,#1f8a4c)}' +
    '.gt .grow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}.gt .glink{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:4px 0;text-decoration:none}.gt a,.gt .glink:hover{text-decoration:none}' +
    '.gt .gpw{position:relative;display:block}.gt .gpw input{padding-right:48px}.gt .geye{position:absolute;right:0;top:0;bottom:0;width:46px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;border-radius:0 10px 10px 0}.gt .geye:hover,.gt .geye[aria-pressed=true]{color:var(--accent)}.gt .geye svg{width:22px;height:22px;pointer-events:none}.gt .geye .off{display:none}.gt .geye[aria-pressed=true] .on{display:none}.gt .geye[aria-pressed=true] .off{display:block}' +
    '.gt .gwait{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:13px}.gt .gdot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:gp 1.1s infinite ease-in-out}@keyframes gp{50%{opacity:.25}}' +
    '.gt .gcontact{margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13.5px;line-height:1.6}.gt .gcontact a{color:var(--accent);font-weight:600}' +
    '.gt .gbig{font-size:38px;text-align:center;margin:4px 0 8px}.gchip{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}' +
    '.req table{width:100%;border-collapse:collapse;font-size:13.5px}.req th,.req td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}.req th{font-size:12px;color:var(--muted);font-weight:600}' +
    '.req .acts{display:flex;gap:6px;flex-wrap:wrap}.req .scroll-x{overflow-x:auto}.req h3{font-size:15px;margin:18px 0 8px}.req .pin{max-width:380px}.req .pin input{width:100%;margin:8px 0;letter-spacing:.3em;font-size:18px}';
  function ensureDom() {
    if (ELG) return;
    var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
    ELG = document.createElement('div'); ELG.id = 'gate'; ELG.className = 'gt'; ELG.hidden = true; document.body.appendChild(ELG);
    ELG.addEventListener('click', onGateClick); ELG.addEventListener('submit', onGateSubmit);
    document.addEventListener('click', function (ev) { var b = ev.target.closest && ev.target.closest('[data-gate]'); if (b && !ELG.contains(b)) onGateClick(ev, b); });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && ev.target && ev.target.id === 'gpin') pinSubmit(); });
  }
  function hideOverlay() { if (ELG) { ELG.hidden = true; ELG.innerHTML = ''; } G.view = ''; }
  function setMsg(t, kind) { var el = document.getElementById('gmsg'); if (el) { el.textContent = t || ''; el.className = 'gmsg ' + (kind || ''); } }
  function head(title, sub) { return '<h1>' + title + '</h1><p class="gsub">' + sub + '</p>'; }
  var EYE = '<button type="button" class="geye" data-gate="eye" aria-label="បង្ហាញ/លាក់ពាក្យសម្ងាត់" aria-pressed="false">' +
    '<svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>' +
    '<svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.6 10.6 0 0 1 12 19C5.5 19 1.5 12 1.5 12a18.5 18.5 0 0 1 4.6-5.4M9.9 5.2A9.9 9.9 0 0 1 12 5c6.5 0 10.5 7 10.5 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>';
  function contact() {
    var t = CFG.telegram; if (!t || !t.phone) return '';
    var ph = String(t.phone).replace(/\D/g, ''), link = t.link || ('https://t.me/+855' + ph.replace(/^0/, ''));
    return '<div class="gcontact">ទាក់ទងអ្នកគ្រប់គ្រងតាម Telegram៖ <a href="' + e(link) + '" target="_blank" rel="noopener">' + e(ph.replace(/^(\d{3})(\d{3})(\d+)$/, '$1 $2 $3')) + '</a></div>';
  }
  function paint(view) {
    ensureDom(); ELG.hidden = false;
    if (view === 'auth') { if (G.view === 'auth' && G.authPainted === G.authMode) return; G.view = 'auth'; G.authPainted = G.authMode; return paintAuth(); }
    if (G.view === view) return; G.view = view; G.authPainted = null;
    var out = '<button class="glink" data-gate="logout">ចាកចេញ</button>';
    if (view === 'wait') ELG.innerHTML = '<div class="gcard"><div class="gwait"><span class="gdot"></span>កំពុងពិនិត្យ…</div></div>';
    else if (view === 'error') ELG.innerHTML = '<div class="gcard">' + head('មិនអាចតភ្ជាប់បាន', 'សូមពិនិត្យអ៊ីនធឺណិត ឬការកំណត់ Firebase ក្នុង config.js រួចសាកម្តងទៀត។') + '<button class="btn primary" data-gate="reload">សាកម្តងទៀត</button></div>';
    else if (view === 'pending') ELG.innerHTML = '<div class="gcard"><div class="gbig">⏳</div>' + head('កំពុងរង់ចាំការយល់ព្រម', 'គណនី <b>' + e(G.user.email) + '</b> ត្រូវបានចុះឈ្មោះរួចហើយ។ អ្នកគ្រប់គ្រងត្រូវយល់ព្រមជាមុនសិន ទើបអ្នកអាចប្រើប្រាស់បាន។ ទំព័រនេះនឹងបើកដោយស្វ័យប្រវត្តិ ពេលសំណើត្រូវបានទទួល។') + '<div class="gwait"><span class="gdot"></span>កំពុងរង់ចាំ…</div>' + contact() + '<div class="grow">' + out + '</div></div>';
    else if (view === 'blocked') ELG.innerHTML = '<div class="gcard"><div class="gbig">🚫</div>' + head('គណនីមិនអាចប្រើប្រាស់បាន', 'គណនី <b>' + e(G.user.email) + '</b> ត្រូវបានអ្នកគ្រប់គ្រងលុប ឬផ្អាក។ សូមទាក់ទងអ្នកគ្រប់គ្រង។') + contact() + '<div class="grow">' + out + '</div></div>';
  }
  function paintAuth() {
    var m = G.authMode, t = { login: ['ចូលប្រើប្រាស់', 'បញ្ចូលអ៊ីមែល និងពាក្យសម្ងាត់ ដើម្បីចូលកម្មវិធីរៀបចំកាលវិភាគ។'], signup: ['ចុះឈ្មោះប្រើប្រាស់', 'បំពេញព័ត៌មានខាងក្រោម។ បន្ទាប់ពីចុះឈ្មោះ អ្នកត្រូវរង់ចាំអ្នកគ្រប់គ្រងយល់ព្រមមុន ទើបអាចប្រើបាន។'], reset: ['ភ្លេចពាក្យសម្ងាត់', 'បញ្ចូលអ៊ីមែល យើងនឹងផ្ញើតំណសម្រាប់កំណត់ពាក្យសម្ងាត់ថ្មី។'] }[m];
    ELG.innerHTML = '<div class="gcard">' + head(t[0], t[1]) + '<form id="gform" novalidate>' +
      (m === 'signup' ? '<label><span>ឈ្មោះ</span><input type="text" name="name" autocomplete="name"></label><label><span>ឈ្មោះសាលា</span><input type="text" name="school" autocomplete="organization"></label>' : '') +
      '<label><span>អ៊ីមែល</span><input type="email" name="email" autocomplete="email" required></label>' +
      (m !== 'reset' ? '<label><span>ពាក្យសម្ងាត់</span><div class="gpw"><input type="password" name="pw" autocomplete="' + (m === 'signup' ? 'new-password' : 'current-password') + '" autocapitalize="off" spellcheck="false" required>' + EYE + '</div></label>' : '') +
      '<div id="gmsg" class="gmsg"></div><button class="btn primary" type="submit" style="width:100%">' + { login: 'ចូលប្រើ', signup: 'ចុះឈ្មោះ', reset: 'ផ្ញើតំណកំណត់ពាក្យសម្ងាត់' }[m] + '</button></form>' +
      '<div class="grow">' + (m === 'login' ? '<button class="glink" data-gate="mode" data-m="signup">មិនទាន់មានគណនី? ចុះឈ្មោះ</button><button class="glink" data-gate="mode" data-m="reset">ភ្លេចពាក្យសម្ងាត់</button>' : '<button class="glink" data-gate="mode" data-m="login">មានគណនីរួចហើយ? ចូលប្រើ</button>') + '</div>' + contact() + '</div>';
    var f = ELG.querySelector('input'); if (f) setTimeout(function () { try { var ae = document.activeElement; if (f.isConnected && (!ae || ae === document.body || !ELG.contains(ae))) f.focus(); } catch (x) {} }, 30);   /* never steal focus from a field the person already started typing in */
  }

  async function onGateSubmit(ev) {
    ev.preventDefault(); if (G.busy) return;
    var f = ev.target, v = function (n) { return f.elements[n] ? f.elements[n].value.trim() : ''; };
    var em = v('email').toLowerCase(), pw = f.elements.pw ? f.elements.pw.value : '';
    if (!em) return setMsg('សូមបញ្ចូលអ៊ីមែល', 'err');
    if (G.authMode === 'signup' && !v('name')) return setMsg('សូមបញ្ចូលឈ្មោះ', 'err');
    if (G.authMode === 'signup' && !v('school')) return setMsg('សូមបញ្ចូលឈ្មោះសាលា', 'err');
    G.busy = true; setMsg('កំពុងដំណើរការ…');
    try {
      if (G.authMode === 'login') await B.signIn(em, pw);
      else if (G.authMode === 'signup') await B.signUp(em, pw, v('name'), v('school'));
      else { await B.reset(em); setMsg('បានផ្ញើតំណទៅអ៊ីមែលរបស់អ្នកហើយ', 'ok'); }
    } catch (x) { setMsg(errMsg(x), 'err'); }
    G.busy = false;
  }
  async function onGateClick(ev, btn) {
    var b = btn || (ev.target.closest && ev.target.closest('[data-gate]')); if (!b) return;
    var a = b.getAttribute('data-gate'), uid = b.getAttribute('data-uid');
    if (a === 'mode') { G.authMode = b.getAttribute('data-m'); G.authPainted = null; paint('auth'); }
    else if (a === 'logout') { try { await B.signOut(); } catch (x) {} location.reload(); }
    else if (a === 'reload') location.reload();
    else if (a === 'pin') pinSubmit();
    else if (a === 'eye') { var inp = b.parentNode.querySelector('input'), show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; b.setAttribute('aria-pressed', show ? 'true' : 'false'); inp.focus(); }
    else if (a === 'publish') publishApp();
    else if (a === 'approve') act(function () { return B.setStatus(uid, 'approved'); }, 'បានទទួលសំណើ');
    else if (a === 'restore') act(function () { return B.setStatus(uid, 'pending'); }, 'បានស្តារទៅបញ្ជីរង់ចាំ');
    else if (a === 'remove') {
      if (G.confirm !== uid) { G.confirm = uid; refreshApp(); setTimeout(function () { if (G.confirm === uid) { G.confirm = null; refreshApp(); } }, 5000); return; }
      G.confirm = null; act(function () { return B.removeUser(uid); }, 'បានលុបអ្នកប្រើប្រាស់');
    }
    else if (a === 'resetpw') act(function () { return B.reset(b.getAttribute('data-email')); }, 'បានផ្ញើតំណកំណត់ពាក្យសម្ងាត់ទៅអ៊ីមែលរបស់គេ');
  }
  async function act(fn, okMsg) { try { await fn(); toast_(okMsg); } catch (x) { toast_(errMsg(x), 'err'); } }

  /* ---------- admin: requests tab ---------- */
  function pinRequired() { return !!(CFG.adminPin || CFG.adminPin === 0) && String(CFG.adminPin) !== ''; }
  function pinSubmit() {
    var el = document.getElementById('gpin'); if (!el) return;
    if (el.value === String(CFG.adminPin)) { G.pinOk = true; refreshApp(); }
    else { el.value = ''; var m = document.getElementById('gpinmsg'); if (m) { m.textContent = 'លេខសម្ងាត់មិនត្រឹមត្រូវ'; m.className = 'gmsg err'; } }
  }
  function realUsers() { return G.users.filter(function (u) { return admins().indexOf(String(u.email || '').toLowerCase()) < 0; }); }
  function pendingCount() { return isAdmin() ? realUsers().filter(function (u) { return u.status === 'pending' || !u.status; }).length : 0; }
  function showRequests() { return isAdmin(); }
  function vRequests() {
    if (!isAdmin()) return '<div class="panel"><div class="empty-note">គ្មានសិទ្ធិ</div></div>';
    if (pinRequired() && !G.pinOk) return '<div class="panel req"><div class="pin"><h2>សំណើចុះឈ្មោះ</h2><p class="sub">បញ្ចូលលេខសម្ងាត់ ដើម្បីចូលទៅគ្រប់គ្រងអ្នកប្រើប្រាស់។</p><input id="gpin" type="password" inputmode="numeric" autocomplete="off" maxlength="16" placeholder="••••"><div id="gpinmsg" class="gmsg"></div><button class="btn primary" data-gate="pin">ចូល</button></div></div>';
    var us = realUsers(), pend = us.filter(function (u) { return u.status === 'pending' || !u.status; }), ok = us.filter(function (u) { return u.status === 'approved'; }), bl = us.filter(function (u) { return u.status === 'blocked'; });
    function row(u, kind) {
      var rm = '<button class="btn sm' + (G.confirm === u.uid ? ' danger armed' : ' danger') + '" data-gate="remove" data-uid="' + e(u.uid) + '">' + (G.confirm === u.uid ? 'ចុចម្តងទៀតដើម្បីលុប' : 'លុប') + '</button>';
      var acts = kind === 'pend' ? '<button class="btn sm primary" data-gate="approve" data-uid="' + e(u.uid) + '">ទទួលសំណើ</button>' + rm :
        kind === 'ok' ? '<button class="btn sm" data-gate="resetpw" data-email="' + e(u.email) + '" title="ផ្ញើតំណកំណត់ពាក្យសម្ងាត់ទៅអ៊ីមែលរបស់គេ">កំណត់ពាក្យសម្ងាត់ឡើងវិញ</button>' + rm :
        '<button class="btn sm" data-gate="restore" data-uid="' + e(u.uid) + '">ស្តារ</button>';
      return '<tr><td>' + e(u.name || '—') + '</td><td>' + e(u.email) + '</td><td>' + e(u.school || '—') + '</td><td>' + dstr(u.createdAt) + '</td><td><div class="acts">' + acts + '</div></td></tr>';
    }
    function tbl(list, kind, empty) {
      return list.length ? '<div class="scroll-x"><table><thead><tr><th>ឈ្មោះ</th><th>អ៊ីមែល</th><th>សាលា</th><th>ថ្ងៃចុះឈ្មោះ</th><th></th></tr></thead><tbody>' + list.map(function (u) { return row(u, kind); }).join('') + '</tbody></table></div>' : '<p class="hint">' + empty + '</p>';
    }
    return '<div class="panel req"><h2>សំណើចុះឈ្មោះ</h2><p class="sub">អ្នកចុះឈ្មោះថ្មីមិនអាចប្រើកម្មវិធីបានទេ រហូតដល់អ្នកចុច «ទទួលសំណើ»។ ពាក្យសម្ងាត់ត្រូវបានគ្រប់គ្រងដោយ Firebase ហើយ <b>មិនត្រូវបានរក្សាទុក ឬបង្ហាញ</b> (ដើម្បីសុវត្ថិភាព)។ បើអ្នកប្រើភ្លេចពាក្យសម្ងាត់ ចុច «កំណត់ពាក្យសម្ងាត់ឡើងវិញ» ដើម្បីផ្ញើតំណទៅអ៊ីមែលរបស់គេ។</p>' +
      '<h3>កំពុងរង់ចាំ (' + K(pend.length) + ')</h3>' + tbl(pend, 'pend', 'គ្មានសំណើថ្មី') +
      '<h3>បានយល់ព្រម (' + K(ok.length) + ')</h3>' + tbl(ok, 'ok', 'មិនទាន់មានអ្នកប្រើប្រាស់') +
      (bl.length ? '<h3>បានលុប (' + K(bl.length) + ')</h3>' + tbl(bl, 'bl', '') : '') +
      '<h3>កំណែកម្មវិធី</h3><p class="sub">កូដកម្មវិធីរក្សាទុកក្នុង Firebase ហើយបើកឱ្យតែអ្នកដែលបានយល់ព្រមប៉ុណ្ណោះ។ ' + (G.appV ? 'កំណែបច្ចុប្បន្ន៖ ' + dstr(G.appV) + '។ ' : '') + 'ដើម្បីអាប់ដេត សូមជ្រើសឯកសារ app-code.txt ថ្មី។</p>' + publishBox(false) + '</div>';
  }

  /* ---------- app code is kept in Firestore: only approved users (or admins) can read it ---------- */
  function publishBox(inOverlay) {
    return '<label><span>ជ្រើសឯកសារកូដកម្មវិធី (app-code.txt)</span><input type="file" id="gappfile" accept=".txt,.js"></label>' +
      (inOverlay ? '<div id="gmsg" class="gmsg"></div>' : '') + '<button class="btn primary" data-gate="publish">ផ្សាយកំណែកម្មវិធី</button>';
  }
  function runCode(code) {
    hideOverlay();
    var sc = document.createElement('script'); sc.textContent = code + '\n//# sourceURL=app-code.js'; document.head.appendChild(sc);
  }
  async function loadApp() {
    ensureDom(); ELG.hidden = false; G.view = 'loading'; G.authPainted = null;
    ELG.innerHTML = '<div class="gcard"><div class="gwait"><span class="gdot"></span>កំពុងទាញយកកម្មវិធី…</div></div>';
    var r = null;
    try { r = await B.appGet(); }
    catch (x) { G.view = 'nocode'; ELG.innerHTML = '<div class="gcard">' + head('មិនអាចទាញយកកម្មវិធីបាន', e(errMsg(x)) + ' (ពិនិត្យ firestore.rules និងអ៊ីនធឺណិត)') + '<button class="btn primary" data-gate="reload">ព្យាយាមម្តងទៀត</button> <button class="glink" data-gate="logout">ចាកចេញ</button></div>'; return; }
    if (r && r.code) { G.appV = r.v; runCode(r.code); return; }
    G.view = 'nocode';
    ELG.innerHTML = '<div class="gcard"><div class="gbig">📦</div>' + (isAdmin()
      ? head('មិនទាន់មានកម្មវិធីក្នុងប្រព័ន្ធ', 'ជ្រើសឯកសារ <b>app-code.txt</b> (ក្នុងកញ្ចប់ដែលខ្ញុំផ្ញើ) ដើម្បីផ្សាយម្តង។ បន្ទាប់មកអ្នកប្រើដែលបានយល់ព្រមនឹងអាចប្រើបាន។') + publishBox(true)
      : head('កម្មវិធីមិនទាន់ត្រូវបានផ្សាយ', 'សូមទាក់ទងអ្នកគ្រប់គ្រង រួចសាកម្តងទៀត។') + contact() + '<div class="grow"><button class="btn primary" data-gate="reload">សាកម្តងទៀត</button></div>') +
      '<div class="grow"><button class="glink" data-gate="logout">ចាកចេញ</button></div></div>';
  }
  async function publishApp() {
    if (!isAdmin()) return;
    var inp = document.getElementById('gappfile'), f = inp && inp.files && inp.files[0], overlay = G.view === 'nocode';
    var say = function (t, k) { if (overlay) setMsg(t, k); else toast_(t, k === 'err' ? 'err' : undefined); };
    if (!f) return say('សូមជ្រើសឯកសារ app-code.txt ជាមុន', 'err');
    var txt = await f.text();
    if (txt.length < 50000 || txt.indexOf('function boot') < 0) return say('ឯកសារនេះមិនមែនជាកូដកម្មវិធីទេ', 'err');
    if (new Blob([txt]).size > 950000) return say('ឯកសារធំពេក (លើស 1 MB របស់ Firestore)', 'err');
    try { await B.appSet(txt); } catch (x) { return say(errMsg(x), 'err'); }
    if (overlay) { loadApp(); } else { G.appV = Date.now(); say('បានផ្សាយកំណែកម្មវិធីថ្មីហើយ — អ្នកប្រើនឹងទទួលបានពេលចូលលើកក្រោយ', 'ok'); refreshApp(); }
  }

  /* ---------- header chip ---------- */
  function chip() {
    if (!enabled() || !G.started || !G.user) return '';
    return '<span class="gchip"><span class="tag" title="' + e(G.user.email) + '">' + e(G.user.email) + '</span>' + (isAdmin() ? '<span class="tag ok">Admin</span>' : '') + '<button class="btn sm" data-gate="logout">ចាកចេញ</button></span>';
  }

  /* ---------- start ---------- */
  async function start(cb) {
    G.cb = cb; ensureDom(); paint('wait');
    try {
      B = CFG.backend || firebaseBackend(CFG); await B.init();
      B.onAuth(function (u) {
        if (u && G.user && G.authKnown && G.user.uid === u.uid) { G.user = u; return; }   /* the same user announced twice: nothing changes */
        if (G.unsubP) { try { G.unsubP(); } catch (x) {} G.unsubP = null; }
        if (G.unsubU) { try { G.unsubU(); } catch (x) {} G.unsubU = null; }
        G.user = u; G.authKnown = true; G.ready = false; G.profile = undefined; G.users = []; G.pinOk = false;
        if (!u) { evaluate(); return; }
        G.unsubP = B.watchProfile(u.uid, function (p) { G.profile = p; G.ready = true; evaluate(); });
        if (isAdminUser(u)) G.unsubU = B.watchUsers(function (list) { var before = pendingCount(); G.users = list; if (G.started && (G.pinOk || pendingCount() !== before || !pinRequired())) refreshApp(); }, function (err) { toast_('មិនអាចអានបញ្ជីអ្នកប្រើបាន៖ ' + errMsg(err), 'err'); });
      });
    } catch (x) { G.cfgErr = x; paint('error'); }
  }
  /* storage adapter handed to the app: same interface as the Claude db document */
  function store() {
    if (!enabled() || !G.user) return null;
    var uid = G.user.uid;
    return { get: async function () { var j = await B.storeGet(uid); return { exists: j != null, data: function () { return { json: j }; } }; }, set: function (o) { return B.storeSet(uid, o.json); } };
  }
  return { enabled: enabled, start: start, chip: chip, store: store, isAdmin: isAdmin, showRequests: showRequests, pendingCount: pendingCount, vRequests: vRequests, loadApp: loadApp, school: function () { return (G.profile && G.profile.school) || ''; } };
})();


window.__SHELL = true;
if (Gate.enabled()) Gate.start(Gate.loadApp);
else document.getElementById('main').innerHTML = '<div class="panel"><div class="empty-note">ត្រូវការ Firebase ក្នុង config.js</div></div>';
</script>

</body>
